[package]
name = "mydash-desktop"
version = "0.2.0"
edition = "2021"
description = "Private mydash desktop client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
context-kit = { path = "../../context-kit/crates/context-kit" }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
regex = "1"
wait-timeout = "0.2"
libc = "0.2"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"
graphql-parser = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSImage"] }
