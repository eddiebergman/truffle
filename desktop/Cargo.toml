[package]
name = "truffle-desktop"
version = "0.2.0"
edition = "2021"
description = "Private truffle desktop client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
context-kit = { path = "../../context-kit/crates/context-kit" }
base64 = "0.22"
# Reads the macOS time zone database instead of bundling one.
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The default features without `compression`, which adds four brotli crates to
# shrink the embedded frontend.
tauri = { version = "2", default-features = false, features = ["wry", "dynamic-acl"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
url = "2.5"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
graphql-parser = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSArray", "NSUserDefaults"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFUserNotification", "CFDate", "CFURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSImage", "NSResponder", "NSWindow"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Tauri requires synchronous command arguments by value.
needless_pass_by_value = "allow"
